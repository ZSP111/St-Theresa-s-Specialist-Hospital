name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
      - name: Run API tests against MongoDB
        run: npm test
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017
      - name: Check the server boots, auto-seeds and serves doctor photos
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: ci-boot
          JWT_SECRET: ci-secret
          ADMIN_EMAIL: admin@ci.test
          ADMIN_PASSWORD: ci-password
          AUTO_SEED: 'true'
          PORT: 4100
        run: |
          node server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:4100/ && break; sleep 1; done
          LIST=$(curl -sf http://localhost:4100/api/doctor/list)
          echo "$LIST" | grep -q 'Dr. Richard James'
          test "$(echo "$LIST" | grep -o '"_id"' | wc -l)" -eq 15
          IMG=$(echo "$LIST" | grep -o 'http://localhost:4100/api/seed-images/doc1.png' | head -1)
          curl -sf -o /dev/null "$IMG"
          npm run seed | grep -q '0 doctor(s) added'
          echo "Server, auto-seed and seed images OK"

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  vercel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (same command as vercel.json)
        run: npm install --prefix frontend && npm install --prefix admin && npm install --prefix backend --omit=dev
      - name: Build (same command as vercel.json)
        run: npm run build
      - name: Check output
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/admin/index.html
          grep -q '/admin/assets/' frontend/dist/admin/index.html
